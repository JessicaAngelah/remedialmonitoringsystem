{% import "_icons.html" as icons %}
<div class="modal-backdrop">
  <div class="modal">
    <form method="post" action="{{ url_for('projects.new_folder') }}">
      <div class="modal-head">
        <span>{{ t.pm.newFolder }}</span>
        <a class="icon-btn" href="{{ close_url }}">{{ icons.icon('x', 16) }}</a>
      </div>
      <div class="modal-body">
        <label>{{ t.pm.folderName }}<input name="name" placeholder="{{ t.pm.folderNamePlaceholder }}" required autofocus></label>
        <label>{{ t.pm.color }}</label>
        <div class="color-row">
          {% for c in ["#004BFF", "#FF003C", "#D6C100", "#00FFA6"] %}
          <label class="swatch {{ 'active' if loop.first else '' }}" style="background:{{ c }}; display:inline-flex;">
            <input type="radio" name="color" value="{{ c }}" {{ 'checked' if loop.first else '' }} style="opacity:0; width:100%; height:100%; margin:0; cursor:pointer;">
          </label>
          {% endfor %}
        </div>
      </div>
      <div class="modal-foot">
        <a class="btn btn-ghost" href="{{ close_url }}">{{ t.pm.cancel }}</a>
        <button class="btn btn-primary" type="submit">{{ t.pm.createFolder }}</button>
      </div>
    </form>
  </div>
</div>
