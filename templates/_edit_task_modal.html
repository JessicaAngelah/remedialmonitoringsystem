{% import "_icons.html" as icons %}
<div class="modal-backdrop">
  <div class="modal">
    <form method="post" action="{{ url_for('tasks.update_task_detail', tid=edit_task.id) }}">
      <input type="hidden" name="redirect_to" value="{{ redirect_to }}">
      <div class="modal-head">
        <span>Edit task</span>
        <a class="icon-btn" href="{{ close_url }}">{{ icons.icon('x', 16) }}</a>
      </div>
      <div class="modal-body">
        <label>Title<input name="title" value="{{ edit_task.title }}" required></label>
        <label>Project
          <div class="combo" id="et-project-combo">
            <input type="text" class="combo-input" id="et-project-search" autocomplete="off" placeholder="Search projects…"
                   value="{{ (PROJECTS | selectattr('id', 'equalto', edit_task.projectId) | map(attribute='name') | first) or '' }}">
            <input type="hidden" name="projectId" id="et-project" value="{{ edit_task.projectId }}">
            <div class="combo-list" id="et-project-list">
              {% for p in PROJECTS %}
              <div class="combo-option" data-value="{{ p.id }}" data-label="{{ p.name }}">{{ p.name }}</div>
              {% endfor %}
            </div>
          </div>
        </label>
        <div class="modal-grid2">
          <label>Assignee
            <select name="assignee">
              <option value="" {{ 'selected' if not edit_task.assignee else '' }}>Unassigned</option>
              {% for s in ASSIGNEES %}<option value="{{ s }}" {{ 'selected' if s == edit_task.assignee else '' }}>{{ s }}</option>{% endfor %}
            </select>
          </label>
          <label>Priority
            <select name="priority">{% for k, v in PRIORITY_META.items() %}<option value="{{ k }}" {{ 'selected' if k == edit_task.priority else '' }}>{{ v.label }}</option>{% endfor %}</select>
          </label>
        </div>
        <div class="modal-grid2">
          <label>Status
            <select name="status">{% for k, v in STATUS_META.items() %}<option value="{{ k }}" {{ 'selected' if k == edit_task.status else '' }}>{{ v.label }}</option>{% endfor %}</select>
          </label>
          <label>Type<input name="type" value="{{ edit_task.type }}"></label>
        </div>
        <div class="modal-grid2">
          <label>Start date<input type="date" name="startDate" value="{{ edit_task.startDate }}"></label>
          <label>Due date<input type="date" name="dueDate" value="{{ edit_task.dueDate }}"></label>
        </div>
        <label>Progress ({{ edit_task.progress }}%)
          <input type="range" name="progress" min="0" max="100" step="5" value="{{ edit_task.progress }}">
        </label>
        <label>Notes<textarea name="notes" rows="3" placeholder="Add context or status notes for this task…">{{ edit_task.notes }}</textarea></label>
      </div>
      <div class="modal-foot">
        <a class="btn btn-ghost" href="{{ close_url }}">Cancel</a>
        <button class="btn btn-primary" type="submit">Save changes</button>
      </div>
    </form>
  </div>
</div>
<script>
(function () {
  var projInput = document.getElementById('et-project');
  var combo = document.getElementById('et-project-combo');
  var search = document.getElementById('et-project-search');
  var list = document.getElementById('et-project-list');
  if (combo && search && list && projInput) {
    var options = Array.prototype.slice.call(list.querySelectorAll('.combo-option'));

    function open() { combo.classList.add('open'); }
    function close() { combo.classList.remove('open'); }

    function filter() {
      var q = search.value.trim().toLowerCase();
      var anyVisible = false;
      options.forEach(function (o) {
        var match = o.getAttribute('data-label').toLowerCase().indexOf(q) !== -1;
        o.style.display = match ? '' : 'none';
        if (match) anyVisible = true;
      });
      var empty = list.querySelector('.combo-empty');
      if (!anyVisible) {
        if (!empty) {
          empty = document.createElement('div');
          empty.className = 'combo-empty';
          empty.textContent = 'No matching projects';
          list.appendChild(empty);
        }
      } else if (empty) {
        empty.remove();
      }
    }

    function select(opt) {
      projInput.value = opt.getAttribute('data-value');
      search.value = opt.getAttribute('data-label');
      options.forEach(function (o) { o.classList.toggle('selected', o === opt); });
      close();
    }

    search.addEventListener('focus', function () { search.select(); open(); filter(); });
    search.addEventListener('input', function () { open(); filter(); });
    list.addEventListener('click', function (e) {
      var opt = e.target.closest('.combo-option');
      if (opt) select(opt);
    });
    document.addEventListener('click', function (e) {
      if (!combo.contains(e.target)) close();
    });
    search.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { close(); search.blur(); }
      if (e.key === 'Enter') {
        e.preventDefault();
        var visible = options.filter(function (o) { return o.style.display !== 'none'; });
        if (visible.length === 1) select(visible[0]);
      }
    });
  }
})();
</script>
